id: project-jaguar
name: Project Jaguar
website: https://pjaguar.com/
founded_year: 2016
description: An EdTech startup democratizing education through a generative AI platform
  specifically trained on Caribbean curricula.
long_description: Project Jaguar began as a marketplace for 'Teacherpreneurs' and
  has pivoted to become a generative AI platform. Their flagship product, Jaguar AI,
  is fine-tuned on Caribbean Secondary Education Certificate (CSEC) and CAPE syllabi,
  using 'Chain of Thought' prompting to act as a pedagogical tutor rather than just
  an answer engine. It addresses the 'data bias' of generic LLMs by focusing on regional
  educational contexts.
industries:
- EdTech
- Education
technologies:
- Generative AI
- Large Language Models
- Natural Language Processing
- Chain of Thought Prompting
