id: michroma
name: Michroma
website: https://www.michroma.co/
founded_year: 2019
description: A Biotech startup creating natural food ingredients using precision fermentation
  and fungal-based colorants.
long_description: Michroma utilizes bioinformatics and AI to screen and optimize fungal
  strains that produce high-performance pigments, such as their flagship 'Red+' colorant.
  By using precision fermentation, they offer a sustainable, clean-label alternative
  to petroleum-derived or insect-based dyes, decoupling ingredient production from
  traditional agriculture.
