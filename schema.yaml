id: unique_slug_name          # e.g., aleph-alpha (matches filename)
name: "Company Name"          # Legal or Trading Name
website: "https://..."        # Homepage URL
logo_url: "https://..."       # Path to logo (remote or local)
founded_year: 2019            # YYYY
description: "A short, one-sentence pitch."
long_description: | # Multi-line description
  A longer paragraph explaining what they do, their unique selling point,
  and their core technology.

# Classification for Filtering
industries:                   # Primary vertical focus
  - "Enterprise Software"
  - "Manufacturing"
technologies:                 # Core AI tech used
  - "LLM"
  - "Computer Vision"
  - "Robotics"

# Location Details
headquarters:
  city: "Heidelberg"
  country_code: "DE"
  region: "Baden-Württemberg" # Helpful for regional analysis (e.g. Cyber Valley)

# Financials (Optional but valuable)
funding:
  total_raised_usd: 533000000 # Integers are easier to sort than strings
  last_round: "Series B"
  investors:                  # Key backers
    - "Earlybird"
    - "UVC Partners"
    - "Schwarz Gruppe"

# Open Source / Developer Angle (Since you are building an Open Index)
open_source:
  active: true                # do they have open source repos?
  github_org: "https://github.com/xxx"
  huggingface_org: "https://huggingface.co/xxxx"

# Socials
socials:
  linkedin: "https://..."
  twitter: "https://..."